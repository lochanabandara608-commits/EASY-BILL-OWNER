async function upd(d,msg,action,detail){const c=find(cur);try{await updateDoc(doc(db,'ebCustomers',cur),d);Object.assign(c,d);log(action,c.business||c.username,detail||JSON.stringify(d).slice(0,200));toast(msg||'Saved','ok');renderAll();return true}catch(e){toast('Failed: '+(e.code||e.message),'err');return false}}
window.saveD=()=>upd({status:$('ms').value,plan:$('mp').value,expiry:$('me').value||'',message:$('mmsg').value.trim()},'Saved','customer:update');
window.addDays=n=>{const c=find(cur);const b=c.expiry&&new Date(c.expiry)>new Date()?new Date(c.expiry):new Date();b.setDate(b.getDate()+n);$('me').value=b.toISOString().slice(0,10);$('ms').value='active';toast('Expiry '+$('me').value+' — press Save')};
window.saveFeat=()=>{const f={};document.querySelectorAll('[data-f]').forEach(i=>f[i.dataset.f]=i.checked);upd({features:f},'Saved','customer:features')};
window.saveNotes=()=>upd({note:$('mn').value.trim(),tags:$('mt').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12)},'Saved','customer:notes');

window.addPay=async()=>{const a=Number($('pa').value);if(!(a>0)){toast('Enter amount','err');return}const c=find(cur);const pc=($('pc').value||cur_(c)).toUpperCase().slice(0,3),pl=$('ppl').value;
 const rec={id:Date.now().toString(36),amt:a,cur:pc,date:$('pd').value||new Date().toISOString().slice(0,10),method:$('pm').value,ref:$('pr').value.trim(),plan:pl,note:''};
 const d={payments:pays(c).concat([rec])};if(pl){d.plan=pl;const p=planInfo(pl);if($('pext').checked&&p&&p.period>0){const b=c.expiry&&new Date(c.expiry)>new Date()?new Date(c.expiry):new Date();b.setDate(b.getDate()+p.period);d.expiry=b.toISOString().slice(0,10);d.status='active'}}
 await upd(d,'Payment recorded','payment:add',money(a,pc)+' '+(pl||''))};

function vAnn(v){

  <select id="asel" multiple size="6" style="display:none;margin-top:8px">${customers.map(c=>`<option value="${esc(c.uid)}">${esc(c.business||c.username)} (${esc(c.username)})</option>`).join('')}</select>

 $('ato').onchange=annTarget;['afc','aft','afp','asel'].forEach(i=>$(i).onchange=annCount);annCount();$('asend').onclick=sendAnn;
 const now=Date.now();$('alist').innerHTML=anns.length?anns.map(a=>{const exp=a.until&&new Date(a.until+'T23:59:59').getTime()<now;return `<div class="it"><div style="min-width:0"><b>${esc(a.title)}</b> <span class="pill ${a.level==='warn'?'p-warn':a.level==='ok'?'p-ok':'p-info'}">${esc(a.level||'info')}</span> ${exp?'<span class="pill p-mu">expired</span>':''}${a.active===false?' <span class="pill p-mu">off</span>':''}<div class="mu sm-t">${esc(a.text)}</div><div class="mu sm-t">${esc(fd(ms(a.createdAt)))} · ${a.target==='all'?'everyone':(a.uids||[]).length+' customers'}${a.until?' · until '+esc(a.until):''}</div></div><div style="white-space:nowrap"><button class="btn sm" data-at="${esc(a.id)}">${a.active===false?'On':'Off'}</button> <button class="btn sm d" data-ad="${esc(a.id)}" aria-label="Delete">${ico('x')}</button></div></div>`}).join(''):`<div class="empty">${esc(t('none'))}</div>`;
 $('alist').querySelectorAll('[data-at]').forEach(b=>b.onclick=async()=>{const a=anns.find(x=>x.id===b.dataset.at);try{await updateDoc(doc(db,'ebAnnouncements',a.id),{active:a.active===false});a.active=a.active===false;log('announcement:toggle',a.title);renderAll()}catch(e){toast('Failed: '+(e.code||e.message),'err')}});
 $('alist').querySelectorAll('[data-ad]').forEach(b=>b.onclick=async()=>{if(!await confirmD('Delete announcement?','This cannot be undone.','Delete'))return;const a=anns.find(x=>x.id===b.dataset.ad);try{await deleteDoc(doc(db,'ebAnnouncements',a.id));log('announcement:delete',a.title);loadAll()}catch(e){toast('Failed: '+(e.code||e.message),'err')}})}
function annTarget(){const m=$('ato').value;$('afl').style.display=m==='filter'?'':'none';$('asel').style.display=m==='selected'?'':'none';annCount()}

function annCount(){const u=annUids();$('acnt').textContent=u===null?customers.length+' customers':u.length+' customers match'}
async function sendAnn(){const ti=$('at').value.trim(),m=$('am').value.trim();if(!ti||!m){toast('Enter title and message','err');return}const u=annUids();if(u!==null&&!u.length){toast('No customers match','err');return}

 $('tkc').onclick=()=>{const c=customers.find(c=>c.uid===x.ownerUid);if(c)openD(c.uid);else toast('Customer not found','err')};
 $('tks').onclick=async()=>{const v=$('tkr').value.trim();if(!v)return;const th=(x.thread||[]).concat([{by:'owner',name:'EASY BILL support',text:v.slice(0,4000),at:Date.now()}]);try{await updateDoc(doc(db,'ebTickets',x.id),{thread:th,status:'answered',updatedAt:serverTimestamp(),unreadCustomer:true,unreadOwner:false});x.thread=th;x.status='answered';log('ticket:reply',x.subject,x.business||'');toast('Sent','ok');renderAll()}catch(e){toast('Failed: '+(e.code||e.message),'err')}};
 $('tkx').onclick=async()=>{const s=x.status==='closed'?'open':'closed';try{await updateDoc(doc(db,'ebTickets',x.id),{status:s,updatedAt:serverTimestamp(),unreadCustomer:true});x.status=s;log('ticket:'+s,x.subject);renderAll()}catch(e){toast('Failed: '+(e.code||e.message),'err')}}}
const _rv=renderView;

/* ---------------- remote config ---------------- */
function vCfg(v){v.innerHTML=`<div class="card" style="max-width:720px"><div class="f"><div><label>${esc(t('latest'))}</label><input id="sv" value="${esc(cfg.latestVersion||'')}"></div><div><label>${esc(t('minV'))}</label><input id="sm" value="${esc(cfg.minVersion||'')}"></div><div><label>${esc(t('dl'))}</label><input id="sd" value="${esc(cfg.downloadUrl||'')}"></div><div><label>${esc(t('contact'))}</label><input id="sc" value="${esc(cfg.contact||'')}"></div></div>
 <label class="chk" style="margin-top:10px"><input type="checkbox" id="mt" ${cfg.maintenance?'checked':''}> ${esc(t('maint'))}</label><label class="mu sm-t" style="font-weight:600">${esc(t('maintMsg'))}</label><textarea id="mtm" rows="2">${esc(cfg.maintenanceMsg||'')}</textarea><button class="btn p" id="svb" style="margin-top:12px">${esc(t('save'))}</button><p class="mu sm-t">Maintenance mode blocks every customer app until you switch it off.</p></div>`;
 $('svb').onclick=async()=>{if($('mt').checked&&!cfg.maintenance&&!await confirmD('Enable maintenance mode?','All customers will be blocked until you turn it off.','Enable'))return;const d={latestVersion:$('sv').value.trim(),minVersion:$('sm').value.trim(),downloadUrl:$('sd').value.trim(),contact:$('sc').value.trim(),maintenance:$('mt').checked,maintenanceMsg:$('mtm').value.trim()};
  try{await setDoc(doc(db,'ebConfig','app'),d,{merge:true});Object.assign(cfg,d);log('config:save','',JSON.stringify(d).slice(0,250));toast('Saved','ok')}catch(e){toast('Failed: '+(e.code||e.message),'err')}}}

/* ---------------- audit ---------------- */
function vAud(v){v.innerHTML=`<div class="card">${audit.length?audit.map(a=>`<div class="it"><div><b>${esc(a.action)}</b> <span class="mu">${esc(a.target||'')}</span><div class="mu sm-t">${esc(a.detail||'')}</div></div><div class="mu sm-t" style="white-space:nowrap">${esc(a.actor||'')} · ${esc(new Date(a.at).toLocaleString())}</div></div>`).join(''):`<div class="empty">${esc(t('none'))}</div>`}</div>`}

setInterval(()=>{if(auth.currentUser&&document.visibilityState==='visible'&&(view==='dash'||view==='sup'))loadAll()},120000);
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('installBtn').style.display=''});
window.installApp=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('installBtn').style.display='none'};
applyLang();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
